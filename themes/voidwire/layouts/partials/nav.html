{{- $cur := . }}
<nav class="site-nav" aria-label="Site">
  <a class="brand" href="{{ "/" | relURL }}">void<b>wire</b> labs</a>
  <div class="links">
  {{- range site.Menus.main }}
    {{- $active := or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) (and (eq .URL "/posts/") (eq $cur.Section "posts")) }}
    <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
  {{- end }}
  </div>
</nav>
